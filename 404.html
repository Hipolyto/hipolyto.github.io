<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abriendo record…</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0;
           display: flex; min-height: 100vh; align-items: center; justify-content: center;
           background: #f4f6f8; color: #333; text-align: center; }
    .card { padding: 32px 28px; }
    .spin { width: 32px; height: 32px; margin: 0 auto 16px; border: 3px solid #d0d7de;
            border-top-color: #0969da; border-radius: 50%; animation: r 0.8s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }
    a { color: #0969da; }
    small { color: #888; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spin"></div>
    <p id="msg">Abriendo el record…</p>
    <p><small id="sub"></small></p>
  </div>

  <script>
  // ===========================================================================
  // Fallback web (CASO B — sin app): el host recibe el deep link y REDIRIGE al
  // record real en ProjectSight web, conservando el query tal cual.
  //
  // En un iPhone CON la app instalada, el OS abre la app por la Universal Link
  // antes de que esta página cargue, así que este script solo corre cuando NO
  // hubo intercepción: sin app, en escritorio, o navegando en el mismo dominio
  // dentro de Safari. GitHub Pages es estático (no hay 302 de servidor), así que
  // hacemos el redirect del lado navegador. GitHub sirve este 404.html para
  // cualquier ruta que no exista — /web/RecordOpener.aspx no es un archivo real,
  // por eso entra aquí; los archivos de /.well-known/ SÍ existen y no pasan por aquí.
  //
  // Formato real del link (el que emite el web):
  //   /web/app/{Tipo}?orgid=..&projid=..&Action=..&PDT=<tipo>&PKID=<id>&OVRO=..
  // El tipo va en la ruta ({Tipo}) y también como PDT en el query. Conservamos la
  // ruta y el query tal cual y solo cambiamos el dominio al real.
  // ===========================================================================

  // Entorno donde viven estos records de prueba: staging.
  var WEB_ORIGIN = 'https://staging.projectsightapp.trimble.com';

  (function () {
    var msg = document.getElementById('msg');
    var sub = document.getElementById('sub');
    var q = new URLSearchParams(location.search);

    // Mínimo para abrir un record: PDT (tipo) y PKID (id). Si falta alguno, no
    // redirigimos a ciegas.
    var pdt  = q.get('PDT');
    var pkid = q.get('PKID');
    var ok = pdt && pkid && /^[0-9]+$/.test(pdt) && /^[0-9]+$/.test(pkid);

    if (!ok) {
      document.querySelector('.spin').style.display = 'none';
      msg.textContent = 'Enlace no reconocido';
      sub.textContent = location.pathname + location.search;
      return;
    }

    // Misma ruta + mismo query, dominio real: el record se abre en el web sin remapear nada.
    var url = WEB_ORIGIN + location.pathname + location.search;

    sub.innerHTML = 'Si no redirige, <a href="' + url + '">abre el record aquí</a>.';
    // replace() para no dejar el host de prueba en el historial del navegador.
    location.replace(url);
  })();
  </script>
</body>
</html>
